<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的菜谱本</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <!-- 首页只列大类；新增大类时在下方 ul 加一条即可 -->
    <section class="card">
      <h1>我的菜谱本</h1>
      <p class="subtitle">先选大类，再按小类找菜。</p>

      <ul class="category-nav">
        <li>
          <a href="pages/categories/meat.html">
            <span class="cat-name">荤菜</span>
            <span class="cat-desc">猪肉 · 牛肉 · 羊肉 · 禽肉 · 水产</span>
          </a>
        </li>
        <li>
          <a href="pages/categories/veg.html">
            <span class="cat-name">素菜</span>
            <span class="cat-desc">叶菜 · 瓜果 · 豆制品 · 菌菇</span>
          </a>
        </li>
        <li>
          <a href="pages/categories/soup.html">
            <span class="cat-name">汤类</span>
            <span class="cat-desc">肉汤 · 素汤 · 粥羹</span>
          </a>
        </li>
        <!-- 新增大类示例：
        <li>
          <a href="pages/categories/xxx.html">
            <span class="cat-name">主食</span>
            <span class="cat-desc">米饭 · 面点 · 饼类</span>
          </a>
        </li>
        -->
      </ul>
      <p class="add-hint">新增菜谱：在 pages/ 新建详情页 → 在对应大类页（categories/）对应小类下加链接。</p>
    </section>
  </main>
  <footer>个人菜谱 · 可部署 GitHub Pages</footer>
</body>
</html>
